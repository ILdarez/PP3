<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="addModalFragment">
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/create}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-header">
                        <h5 class="modal-title">Add User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="text" class="form-control mb-2" name="firstName" placeholder="First Name" required>
                        <input type="text" class="form-control mb-2" name="lastName" placeholder="Last Name" required>
                        <input type="number" class="form-control mb-2" name="age" placeholder="Age" required>
                        <input type="email" class="form-control mb-2" name="email" placeholder="Email" required>
                        <input type="password" class="form-control mb-2" name="password" placeholder="Password"
                               required>

                        <label class="form-label mt-2">Roles:</label>
                        <select name="roles" multiple class="form-select" required>
                            <option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.name}"></option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
