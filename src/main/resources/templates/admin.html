<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #343a3f !important;
        }

        .logout-link {
            color: #9e9e9e !important;
            text-decoration: none !important;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-link:hover {
            color: #bdbdbd !important;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 500;
        }

        .sidebar {
            width: 200px;
            background: #fdfdfd;
            height: calc(100vh - 76px);
            position: fixed;
            padding-top: 20px;
        }

        .nav-link {
            color: #0d6efd !important;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .main-content {
            margin-left: 200px;
            padding: 20px;
            background-color: #f6f7f8;
        }

        .nav-tabs .nav-link {
            color: #0d6efd;
            border: 1px solid transparent;
        }

        .nav-tabs .nav-link.active {
            background-color: #fdfdfd !important;
            border-color: #dee2e6 #dee2e6 #fff;
            color: #6c757d !important;
            font-weight: 500;
        }

        .nav-tabs {
            border-bottom: 2px solid #dee2e6;
        }

        .tab-content {
            border: 1px solid #d9dcdf;
            background-color: #fdfdfd;
        }

        .btn-info {
            background-color: #17a1b7;
            border-color: #20c997;
        }

        .btn-info:hover {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }

        .custom-table {
            margin: 1rem;
            border-collapse: collapse;
            width: calc(100% - 2rem);
            background-color: #fdfdfd;
        }

        .custom-table thead th {
            border-bottom: 2px solid #dee2e6 !important;
            background-color: #f8f9fa;
        }

        .custom-table th,
        .custom-table td {
            padding: 12px;

        }

        .role-select {
            padding: 4px 8px 4px 8px;
            border: 2px solid #d9dee2 !important;
            border-radius: 8px;
            overflow-y: scroll;
            max-height: 150px;
            margin-top: 0.1rem;
        }

        .role-option {
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 0;

        }

        .role-option:hover {
            background-color: #0d6efd;
        }

        .role-option:hover .role-label {
            color: white !important;
        }

        .role-label {
            display: block;
            color: #495057;
            transition: all 0.3s ease;
            text-align: left;
            margin: 0;
        }

        .role-select::-webkit-scrollbar {
            width: 16px;
        }

        .role-select::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .role-select::-webkit-scrollbar-thumb {
            background: #0dcaf0;
            border-radius: 8px;
        }

        .role-select::-webkit-scrollbar-button:single-button {
            background-color: #f1f1f1;
            background-repeat: no-repeat;
            background-position: center;
            height: 16px;
        }

        .role-select::-webkit-scrollbar-button:single-button:vertical:decrement {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' fill='%236c757d'><polygon points='0,4 8,4 4,0'/></svg>");
        }

        .role-select::-webkit-scrollbar-button:single-button:vertical:increment {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' fill='%236c757d'><polygon points='0,0 4,4 8,0'/></svg>");
        }

        input[type="checkbox"]:checked + .role-label {
            background-color: #0d6efd;
            color: white !important;
        }

        .card-body .form-label {
            margin-bottom: 0.1rem;
            margin-top: 0.1rem;
            color: #1f1c18;
        }

        .text-center.mt-4 {
            margin-top: 0.1rem !important;
        }

        .modal {
            backdrop-filter: blur(2px);
        }

        .modal-dialog {
            max-width: 600px;
            margin: 1.75rem auto;
        }

        body.modal-open {
            overflow: auto;
            padding-right: 0 !important;
        }

        .modal-body .input-field {
            width: 100%;
        }

        .modal-content {
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .modal-header {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        .modal-title {
            color: #212529;
            font-weight: 500;
        }

        .input-field {
            border: 2px solid #d9dee2;
            border-radius: 8px;
            padding: 8px 12px;
            transition: border-color 0.3s ease;
        }

        .input-field:hover,
        .input-field:focus {
            border-color: #0d6efd !important;
        }

        .input-field:focus {
            border-color: #d9dee2;
            box-shadow: none;
        }

        .modal-body .role-select {
            max-height: 120px;
        }

        input[readonly] {
            background-color: #e7eaed !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bg-opacity-10 {
            background-color: rgba(108, 117, 125, 0.1) !important;
        }

        #deleteModal .input-field:hover,
        #deleteModal .input-field:focus {
            border-color: #ced4da !important;
            box-shadow: none !important;
        }

        #deleteModal .role-select {
            background-color: #e9ecef !important;
            border-color: #ced4da !important;
            pointer-events: none;
        }

        #deleteModal .role-label {
            color: #6c757d !important;
            background-color: transparent !important;
        }

        #deleteModal .role-option:hover {
            background-color: transparent !important;
        }

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar py-3">
    <div class="container-fluid">
        <span class="navbar-brand text-white">
            <span th:text="${#authentication.name}"></span>
            with roles:
            <span th:each="role : ${#authentication.authorities}"
                  th:text="${role.authority} + ' '"></span>
        </span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
        </form>
    </div>
</nav>
<div class="sidebar">
    <nav class="nav flex-column">
        <a class="nav-link active" href="/admin">Admin</a>
        <a class="nav-link" href="/user">User</a>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <h1 class="mb-3">Admin panel</h1>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active"
                        id="users-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#users"
                        type="button"
                        role="tab"
                        aria-controls="users"
                        aria-selected="true">
                    Users table
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="new-user-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#new-user"
                        type="button"
                        role="tab"
                        aria-controls="new-user"
                        aria-selected="false">
                    New User
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="users" role="tabpanel" aria-labelledby="users-tab">
                <h3 class="pt-3 pb-2 ps-3 bg-light border-bottom m-0">All users</h3>
                <table class="table custom-table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:each="role : ${user.roles}"
                                  th:text="${role.name} + ' '"></span>
                        </td>
                        <td>
                            <button class="btn btn-info btn-sm"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editModal"
                                    th:data-id="${user.id}"
                                    th:data-firstname="${user.firstName}"
                                    th:data-lastname="${user.lastName}"
                                    th:data-age="${user.age}"
                                    th:data-email="${user.email}"
                                    th:data-roles="${#strings.listJoin(user.roles.![name], ',')}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteModal"
                                    th:data-id="${user.id}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="tab-pane fade" id="new-user" role="tabpanel" aria-labelledby="new-user-tab">
                <h3 class="pt-3 pb-2 ps-3 bg-light border-bottom m-0">Add new user</h3>
                <div class="card border-0 bg-transparent">
                    <div class="card-body">
                        <form th:action="@{/admin/create}" method="post" class="mx-auto" style="max-width: 500px;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">First Name</label>
                                <input type="text" name="firstName" class="form-control input-field" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">Last Name</label>
                                <input type="text" name="lastName" class="form-control input-field" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">Age</label>
                                <input type="number" name="age" class="form-control input-field" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">Email</label>
                                <input type="email" name="email" class="form-control input-field" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">Password</label>
                                <input type="password" name="password" class="form-control input-field" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-center w-100">Role</label>
                                <div class="role-select">
                                    <div class="role-option" th:each="role : ${allRoles}">
                                        <input type="checkbox"
                                               name="roles"
                                               th:value="${role.name}"
                                               th:id="'role_' + ${role.id}"
                                               class="visually-hidden">
                                        <label th:for="'role_' + ${role.id}"
                                               th:text="${role.name}"
                                               class="role-label ps-3"></label>
                                    </div>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-success">Add new user</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form th:action="@{/admin/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">ID</label>
                        <input type="text" name="id" id="editId"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">First Name</label>
                        <input type="text" name="firstName" id="editFirstName"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Last Name</label>
                        <input type="text" name="lastName" id="editLastName"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Age</label>
                        <input type="number" name="age" id="editAge"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Email</label>
                        <input type="email" name="email" id="editEmail"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Password</label>
                        <input type="password" name="password" id="editPassword"
                               class="form-control input-field">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Role</label>
                        <div class="role-select">
                            <div class="role-option" th:each="role : ${allRoles}">
                                <input type="checkbox"
                                       name="roles"
                                       th:value="${role.name}"
                                       th:id="${'editRole_' + role.id}"
                                       class="visually-hidden">
                                <label th:for="${'editRole_' + role.id}"
                                       th:text="${role.name}"
                                       class="role-label ps-3"></label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/delete}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="modal-header">
                    <h5 class="modal-title">Delete user</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">ID</label>
                        <input type="text" name="id" id="deleteId"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">First Name</label>
                        <input type="text" name="firstName" id="deleteFirstName"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Last Name</label>
                        <input type="text" name="lastName" id="deleteLastName"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Age</label>
                        <input type="number" name="age" id="deleteAge"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Email</label>
                        <input type="email" name="email" id="deleteEmail"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Password</label>
                        <input type="password" name="password" id="deletePassword"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Role</label>
                        <div class="role-select bg-secondary bg-opacity-10"
                             style="cursor: not-allowed; user-select: none;">
                            <div class="role-option" th:each="role : ${allRoles}">
                                <input type="checkbox"
                                       name="roles" id="deleteRoles"
                                       th:value="${role.name}"
                                       th:id="${'editRole_' + role.id}"
                                       class="visually-hidden">
                                <label th:for="${'editRole_' + role.id}"
                                       th:text="${role.name}"
                                       class="role-label ps-3"
                                       style="cursor: not-allowed; user-select: none;"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const editModal = document.getElementById('editModal');
    editModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;

        // Установка основных полей
        document.getElementById('editId').value = button.getAttribute('data-id');
        document.getElementById('editFirstName').value = button.getAttribute('data-firstname');
        document.getElementById('editLastName').value = button.getAttribute('data-lastname');
        document.getElementById('editAge').value = button.getAttribute('data-age');
        document.getElementById('editEmail').value = button.getAttribute('data-email');

        const roleCheckboxes = editModal.querySelectorAll('input[name="roles"]');
        roleCheckboxes.forEach(checkbox => checkbox.checked = false);

        const userRoles = button.getAttribute('data-roles').split(',');
        roleCheckboxes.forEach(checkbox => {
            if (userRoles.includes(checkbox.value)) {
                checkbox.checked = true;
            }
        });
    });

    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        document.getElementById('deleteId').value = button.getAttribute('data-id');
        document.getElementById('deleteFirstName').value = button.getAttribute('data-firstname');
        document.getElementById('deleteLastName').value = button.getAttribute('data-lastname');
        document.getElementById('deleteAge').value = button.getAttribute('data-age');
        document.getElementById('deleteEmail').value = button.getAttribute('data-email');
    });
</script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
