<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #343a3f !important;
        }
        .logout-link {
            color: #9e9e9e !important;
            text-decoration: none !important;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }
        .logout-link:hover {
            color: #bdbdbd !important;
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: 500;
        }

        .sidebar {
            width: 200px;
            background: #f8f9fa;
            height: calc(100vh - 76px);
            position: fixed;
            padding: 20px;
            border-right: 1px solid #dee2e6;
        }

        .nav-link {
            color: #0d6efd !important;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }


        .main-content {
            margin-left: 200px;
            padding: 20px;
        }


        .custom-navbar {
            background-color: #343a3f !important;
            height: 76px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar py-3">
    <div class="container-fluid">
        <span class="navbar-brand text-white">
            <span th:text="${#authentication.name}"></span>
            with roles:
            <span th:each="role : ${#authentication.authorities}"
                  th:text="${role.authority} + ' '"></span>
        </span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
        </form>
    </div>
</nav>
<div class="sidebar">
    <nav class="nav flex-column">
        <a class="nav-link active" href="/admin">Admin</a>
        <a class="nav-link" href="/user">User</a>
    </nav>
</div>

<div class="container">
    <h1 class="mb-4">Admin panel</h1>

    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        New User
    </button>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.firstName}"></td>
            <td th:text="${user.lastName}"></td>
            <td th:text="${user.age}"></td>
            <td th:text="${user.email}"></td>
            <td>
                        <span th:each="role : ${user.roles}"
                              th:text="${role.name} + ' '"></span>
            </td>
            <td>
                <button class="btn btn-warning btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#editModal"
                        th:data-id="${user.id}"
                        th:data-firstname="${user.firstName}"
                        th:data-lastname="${user.lastName}"
                        th:data-age="${user.age}"
                        th:data-email="${user.email}"
                        th:data-roles="${#strings.listJoin(user.roles.![name], ',')}">
                    Edit
                </button>
                <button class="btn btn-danger btn-sm ms-2"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteModal"
                        th:data-id="${user.id}">
                    Delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-header">
                    <h5 class="modal-title">Add new user</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>First name</label>
                        <input type="text" name="firstName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Last name</label>
                        <input type="text" name="lastName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" name="age" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Roles</label>
                        <div th:each="role : ${allRoles}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="roles"
                                       th:value="${role.name}"
                                       th:id="'roleAdd_' + ${role.id}">
                                <label class="form-check-label"
                                       th:for="'roleAdd_' + ${role.id}"
                                       th:text="${role.name}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Add new user</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="editId">
                    <div class="mb-3">
                        <label>First Name</label>
                        <input type="text" class="form-control" name="firstName" id="editFirstName">
                    </div>
                    <div class="mb-3">
                        <label>Last Name</label>
                        <input type="text" class="form-control" name="lastName" id="editLastName">
                    </div>
                    <div class="mb-3">
                        <label>Age</label>
                        <input type="number" class="form-control" name="age" id="editAge">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" id="editEmail">
                    </div>
                    <div class="mb-3">
                        <label>Password (leave empty to keep current)</label>
                        <input type="password" class="form-control" name="password" id="editPassword">
                    </div>
                    <div class="mb-3">
                        <label>Roles</label>
                        <div th:each="role : ${allRoles}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       name="roles"
                                       th:value="${role.name}"
                                       th:id="${'roleEdit_' + role.id}">
                                <label class="form-check-label" th:text="${role.name}"
                                       th:for="${'roleEdit_' + role.id}"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/delete}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="id" id="deleteId"> <!-- Это поле обязательно -->
                <div class="modal-header">
                    <h5 class="modal-title">Delete user</h5>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this user?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        document.getElementById('editId').value = button.getAttribute('data-id');
        document.getElementById('editFirstName').value = button.getAttribute('data-firstname');
        document.getElementById('editLastName').value = button.getAttribute('data-lastname');
        document.getElementById('editAge').value = button.getAttribute('data-age');
        document.getElementById('editEmail').value = button.getAttribute('data-email');

        const allRoleCheckboxes = document.querySelectorAll('#editModal input[name="roles"]');
        const roles = button.getAttribute('data-roles').split(',').map(r => r.trim());
        allRoleCheckboxes.forEach(checkbox => {
            checkbox.checked = roles.includes(checkbox.value);
        });
    });

    document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        document.getElementById('deleteId').value = button.getAttribute('data-id');
    });
</script>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
