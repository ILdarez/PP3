<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #343a3f !important;
        }

        .logout-link {
            color: #9e9e9e !important;
            text-decoration: none !important;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-link:hover {
            color: #bdbdbd !important;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 500;
        }

        .sidebar {
            width: 200px;
            background: #fdfdfd;
            height: calc(100vh - 76px);
            position: fixed;
            padding-top: 20px;
        }

        .nav-link {
            color: #0d6efd !important;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .main-content {
            margin-left: 200px;
            padding: 20px;
            background-color: #f6f7f8;
        }

        .nav-tabs .nav-link {
            color: #0d6efd;
            border: 1px solid transparent;
        }

        .nav-tabs .nav-link.active {
            background-color: #fdfdfd !important;
            border-color: #dee2e6 #dee2e6 #fff;
            color: #6c757d !important;
            font-weight: 500;
        }

        .nav-tabs {
            border-bottom: 2px solid #dee2e6;
        }

        .tab-content {
            border: 1px solid #d9dcdf;
            background-color: #fdfdfd;
        }

        .btn-info {
            background-color: #17a1b7;
            border-color: #20c997;
        }

        .btn-info:hover {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }

        .custom-table {
            margin: 1rem;
            border-collapse: collapse;
            width: calc(100% - 2rem);
            background-color: #fdfdfd;
        }

        .custom-table thead th {
            border-bottom: 2px solid #dee2e6 !important;
            background-color: #f8f9fa;
        }

        .custom-table th,
        .custom-table td {
            padding: 12px;

        }

        .role-select {
            padding: 4px 8px 4px 8px;
            border: 2px solid #d9dee2 !important;
            border-radius: 8px;
            overflow-y: scroll;
            max-height: 150px;
            margin-top: 0.1rem;
        }

        .role-option {
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 0;

        }

        .role-option:hover {
            background-color: #0d6efd;
        }

        .role-option:hover .role-label {
            color: white !important;
        }

        .role-label {
            display: block;
            color: #495057;
            transition: all 0.3s ease;
            text-align: left;
            margin: 0;
        }

        .role-select::-webkit-scrollbar {
            width: 16px;
        }

        .role-select::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .role-select::-webkit-scrollbar-thumb {
            background: #0dcaf0;
            border-radius: 8px;
        }

        .role-select::-webkit-scrollbar-button:single-button {
            background-color: #f1f1f1;
            background-repeat: no-repeat;
            background-position: center;
            height: 16px;
        }

        .role-select::-webkit-scrollbar-button:single-button:vertical:decrement {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' fill='%236c757d'><polygon points='0,4 8,4 4,0'/></svg>");
        }

        .role-select::-webkit-scrollbar-button:single-button:vertical:increment {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8' fill='%236c757d'><polygon points='0,0 4,4 8,0'/></svg>");
        }

        input[type="checkbox"]:checked + .role-label {
            background-color: #0d6efd;
            color: white !important;
        }

        .card-body .form-label {
            margin-bottom: 0.1rem;
            margin-top: 0.1rem;
            color: #1f1c18;
        }

        .text-center.mt-4 {
            margin-top: 0.1rem !important;
        }

        .modal {
            backdrop-filter: blur(2px);
        }

        .modal-dialog {
            max-width: 600px;
            margin: 1.75rem auto;
        }

        body.modal-open {
            overflow: auto;
            padding-right: 0 !important;
        }

        .modal-body .input-field {
            width: 100%;
        }

        .modal-content {
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .modal-header {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
        }

        .modal-title {
            color: #212529;
            font-weight: 500;
        }

        .input-field {
            border: 2px solid #d9dee2;
            border-radius: 8px;
            padding: 8px 12px;
            transition: border-color 0.3s ease;
        }

        .input-field:hover,
        .input-field:focus {
            border-color: #0d6efd !important;
        }

        .input-field:focus {
            border-color: #d9dee2;
            box-shadow: none;
        }

        .modal-body .role-select {
            max-height: 120px;
        }

        input[readonly] {
            background-color: #e7eaed !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .bg-opacity-10 {
            background-color: rgba(108, 117, 125, 0.1) !important;
        }

        #deleteModal .input-field:hover,
        #deleteModal .input-field:focus {
            border-color: #ced4da !important;
            box-shadow: none !important;
        }

        #deleteModal .role-select {
            background-color: #e9ecef !important;
            border-color: #ced4da !important;
            pointer-events: none;
        }

        #deleteModal .role-label {
            color: #6c757d !important;
            background-color: transparent !important;
        }

        #deleteModal .role-option:hover {
            background-color: transparent !important;
        }

    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar py-3">
    <div class="container-fluid">
        <span class="navbar-brand text-white" id="adminUserInfo"></span>
        <form id="logoutForm" action="/logout" method="post" class="d-inline">
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
        </form>
    </div>
</nav>
<div class="sidebar">
    <nav class="nav flex-column">
        <a class="nav-link active" href="#" data-page="admin">Admin</a>
        <a class="nav-link" href="#" data-page="user">User</a>
    </nav>
</div>

<div id="adminContent" class="main-content">
    <div class="container">
        <div class="tab-content">
            <div class="tab-pane fade show active" id="adminUsersTabContent" role="tabpanel">
                <h1 class="mb-3">Admin panel</h1>

                <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active"
                                id="adminUsersTab"
                                data-bs-toggle="tab"
                                data-bs-target="#adminUsers"
                                type="button"
                                role="tab"
                                aria-controls="adminUsers"
                                aria-selected="true">
                            Users table
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link"
                                id="adminNewUserTab"
                                data-bs-toggle="tab"
                                data-bs-target="#adminNewUser"
                                type="button"
                                role="tab"
                                aria-controls="adminNewUser"
                                aria-selected="false">
                            New User
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="adminTabContent">
                    <div class="tab-pane fade show active" id="adminUsers" role="tabpanel">
                        <h3 class="pt-3 pb-2 ps-3 bg-light border-bottom m-0">All users</h3>
                        <table class="table custom-table table-striped" id="adminUsersTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tbody id="adminUsersTableBody"></tbody>
                        </table>
                    </div>

                    <div class="tab-pane fade" id="adminNewUser" role="tabpanel" aria-labelledby="new-user-tab">
                        <h3 class="pt-3 pb-2 ps-3 bg-light border-bottom m-0">Add new user</h3>
                        <div class="card border-0 bg-transparent">
                            <div class="card-body">
                                <form id="adminNewUserForm" class="mx-auto" style="max-width: 500px;">
                                    <div class="mb-4">
                                        <label for="adminFirstName" class="form-label fw-bold text-center w-100">First
                                            Name</label>
                                        <input type="text"
                                               id="adminFirstName"
                                               name="firstName"
                                               class="form-control input-field"
                                               required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="adminLastName" class="form-label fw-bold text-center w-100">Last
                                            Name</label>
                                        <input type="text"
                                               id="adminLastName"
                                               name="lastName"
                                               class="form-control input-field"
                                               required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="adminAge" class="form-label fw-bold text-center w-100">Age</label>
                                        <input type="number"
                                               id="adminAge"
                                               name="age"
                                               class="form-control input-field"
                                               required
                                               min="1">
                                    </div>

                                    <div class="mb-4">
                                        <label for="adminEmail"
                                               class="form-label fw-bold text-center w-100">Email</label>
                                        <input type="email"
                                               id="adminEmail"
                                               name="email"
                                               class="form-control input-field"
                                               required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="adminPassword"
                                               class="form-label fw-bold text-center w-100">Password</label>
                                        <input type="password"
                                               id="adminPassword"
                                               name="password"
                                               class="form-control input-field"
                                               required>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label fw-bold text-center w-100">Role</label>
                                        <div class="role-select" id="adminRolesContainer"></div>
                                    </div>

                                    <div class="text-center mt-4">
                                        <button type="submit" class="btn btn-success">Add new user</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="userTabContent" role="tabpanel">
                <h1 class="mb-3">User panel</h1>
                <table class="table custom-table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Roles</th>
                    </tr>
                    </thead>
                    <tbody id="userData">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="editModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form id="editUserForm">
                <div class="modal-header">
                    <h5 class="modal-title">Edit User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">ID</label>
                        <input type="text" name="id" id="editId"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">First Name</label>
                        <input type="text" name="firstName" id="editFirstName"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Last Name</label>
                        <input type="text" name="lastName" id="editLastName"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Age</label>
                        <input type="number" name="age" id="editAge"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Email</label>
                        <input type="email" name="email" id="editEmail"
                               class="form-control input-field" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Password</label>
                        <input type="password" name="password" id="editPassword"
                               class="form-control input-field">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Role</label>
                        <div class="role-select" id="editRolesContainer"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="deleteUserForm">
                <div class="modal-header">
                    <h5 class="modal-title">Delete user</h5>
                </div>
                <div class="modal-body">
                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">ID</label>
                        <input type="text" name="id" id="deleteId"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">First Name</label>
                        <input type="text" name="firstName" id="deleteFirstName"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Last Name</label>
                        <input type="text" name="lastName" id="deleteLastName"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Age</label>
                        <input type="number" name="age" id="deleteAge"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Email</label>
                        <input type="email" name="email" id="deleteEmail"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Password</label>
                        <input type="password" name="password" id="deletePassword"
                               class="form-control input-field bg-secondary bg-opacity-10" readonly
                               style="cursor: not-allowed; user-select: none;">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-center w-100">Role</label>
                        <div class="role-select bg-secondary bg-opacity-10"
                             style="cursor: not-allowed; user-select: none;"
                             id="deleteRolesContainer">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        const csrfToken = $('meta[name="_csrf"]').attr('content');
        const csrfHeader = $('meta[name="_csrf_header"]').attr('content');
        const adminUserInfo = $('#adminUserInfo');
        const logoutForm = $('.navbar form[action="/logout"]');
        console.log('Logout form element:', logoutForm);
        if (logoutForm.length > 0) {
            console.log('Logout form found.');
        } else {
            console.error('Logout form NOT found. Check your HTML.');
        }
        const sidebarLinks = $('.sidebar .nav-link');
        const adminContent = $('#adminContent');
        const adminTabs = $('#adminTabs');
        const adminTabContent = $('#adminTabContent');
        const adminUsersTab = $('#adminUsersTab');
        const adminNewUserTab = $('#adminNewUserTab');
        const adminUsers = $('#adminUsers');
        const adminNewUser = $('#adminNewUser');
        const adminUsersTable = $('#adminUsersTable');
        const adminUsersTableBody = $('#adminUsersTableBody');
        const editModal = $('#editModal');
        const deleteModal = $('#deleteModal');
        const editUserForm = $('#editUserForm');
        const deleteUserForm = $('#deleteUserForm');
        const adminNewUserForm = $('#adminNewUserForm');
        const adminRolesContainer = $('#adminRolesContainer');
        const editUserRolesContainer = $('#editRolesContainer');
        const deleteRolesContainer = $('#deleteRolesContainer');
        const deleteUserIdDisplay = $('#deleteUserId');
        const sidebar = $('.sidebar .nav');
        const userDataTableBody = $('#userData');
        let currentUserRoles = [];

        function fetchCurrentUser() {
            fetch('/api/rest/current-user')
                .then(response => response.json())
                .then(user => {
                    const roles = user.roles.map(role => role.name);
                    adminUserInfo.text(`${user.firstName} with roles: ${roles.join(', ')}`);
                    currentUserRoles = roles;

                    sidebar.empty();

                    if (currentUserRoles.includes('ROLE_ADMIN')) {
                        sidebar.append('<a class="nav-link active" href="#" data-bs-toggle="tab" data-bs-target="#adminUsersTabContent" role="tab" aria-controls="adminUsersTabContent" aria-selected="true">Admin</a>');
                        loadAdminContent();
                        sidebar.append('<a class="nav-link" href="#" data-bs-toggle="tab" data-bs-target="#userTabContent" role="tab" aria-controls="userTabContent" aria-selected="false">User</a>');
                    } else {
                        sidebar.append('<a class="nav-link active" href="#" data-bs-toggle="tab" data-bs-target="#userTabContent" role="tab" aria-controls="userTabContent" aria-selected="true">User</a>');
                        loadUserContent();
                        if (currentUserRoles.includes('ROLE_ADMIN')) {
                            sidebar.append('<a class="nav-link" href="#" data-bs-toggle="tab" data-bs-target="#adminUsersTabContent" role="tab" aria-controls="adminUsersTabContent" aria-selected="false">Admin</a>');
                        }
                    }

                    const csrfInput = $('<input>').attr({type: 'hidden', name: csrfHeader, value: csrfToken});
                    logoutForm.prepend(csrfInput.clone());

                    const triggerTabListSidebar = [].slice.call(document.querySelectorAll('.sidebar a[data-bs-toggle="tab"]'));
                    triggerTabListSidebar.forEach(triggerEl => {
                        new bootstrap.Tab(triggerEl);
                    });

                    if (currentUserRoles.includes('ROLE_ADMIN')) {
                        const adminTab = new bootstrap.Tab(document.querySelector('a[data-bs-target="#adminUsersTabContent"]'));
                        adminTab.show();
                        loadAdminContent(); // Загружаем админский контент
                    } else {
                        const userTab = new bootstrap.Tab(document.querySelector('a[data-bs-target="#userTabContent"]'));
                        userTab.show();
                        loadUserContent();
                    }
                });
        }

        function loadAdminContent() {
            fetchUsers();
        }

        function loadUserContent() {
            fetchCurrentUserDetails();
        }

        function fetchCurrentUserDetails() {
            fetch('/api/rest/current-user')
                .then(response => response.json())
                .then(user => {
                    displayUserInfo(user);
                })
                .catch(error => {
                    console.error('Failed to fetch current user details:', error);
                    userDataTableBody.html('<tr><td colspan="6" class="text-danger">Failed to load user information.</td></tr>');
                });
        }

        function displayUserInfo(user) {
            userDataTableBody.empty();
            const row = `
            <tr>
                <td>${user.id}</td>
                <td>${user.firstName}</td>
                <td>${user.lastName}</td>
                <td>${user.age}</td>
                <td>${user.email}</td>
                <td>${user.roles.map(role => role.name).join(', ')}</td>
            </tr>
        `;
            userDataTableBody.append(row);
        }

        function fetchUsers() {
            fetch('/api/rest/users')
                .then(response => response.json())
                .then(users => {
                    displayUsers(users);
                });
        }

        function fetchRoles(container) {
            return fetch('/api/rest/roles')
                .then(response => response.json())
                .then(roles => {
                    let options = '';
                    roles.forEach(role => {
                        options += `
                    <div class="role-option">
                        <input type="checkbox" name="roleIds" value="${role.id}" id="role_${role.id}" class="visually-hidden">
                        <label for="role_${role.id}" class="role-label ps-3">${role.name}</label>
                    </div>
                `;
                    });
                    container.html(options);
                    return roles;
                });
        }

        function displayUsers(users) {
            adminUsersTableBody.empty();
            users.forEach(user => {
                const row = `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.firstName}</td>
                    <td>${user.lastName}</td>
                    <td>${user.age}</td>
                    <td>${user.email}</td>
                    <td>${user.roles.map(role => role.name).join(' ')}</td>
                    <td>
                        <button class="btn btn-info btn-sm edit-user-btn"
                                data-bs-toggle="modal"
                                data-bs-target="#editModal"
                                data-id="${user.id}">
                            Edit
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm delete-user-btn"
                                data-bs-toggle="modal"
                                data-bs-target="#deleteModal"
                                data-id="${user.id}">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
                adminUsersTableBody.append(row);
            });
        }

        editModal.on('show.bs.modal', function (event) {
            const button = $(event.relatedTarget);
            const userId = button.data('id');

            fetch(`/api/rest/users/${userId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(user => {
                    $('#editId').val(user.id);
                    $('#editFirstName').val(user.firstName);
                    $('#editLastName').val(user.lastName);
                    $('#editAge').val(user.age);
                    $('#editEmail').val(user.email);

                    fetchRoles(editUserRolesContainer).then(() => {
                        editUserRolesContainer.find('input[name="roleIds"]').each(function () {
                            const roleLabel = $(this).next('.role-label').text();
                            $(this).prop('checked', user.roles.some(role => role.name === roleLabel));
                        });
                    });
                })
                .catch(error => {
                    console.error('Failed to fetch user details for edit:', error);
                });
        });

        editUserForm.on('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);
            const roleIds = [];
            $('#editRolesContainer input[name="roleIds"]:checked').each(function () {
                formData.append('roleIds', $(this).val());
            });
            const id = $('#editId').val();
            fetch(`/api/rest/users/${id}`, {
                method: 'PUT',
                headers: {
                    [csrfHeader]: csrfToken
                },
                body: formData
            })
                .then(response => {
                    if (response.ok) {
                        editModal.modal('hide');
                        fetchUsers();
                    } else {
                        console.error('Failed to update user');
                        response.json().then(errorData => console.log(errorData));
                    }
                });
        });

        deleteModal.on('show.bs.modal', function (event) {
            const button = $(event.relatedTarget);
            const userId = button.data('id');

            fetch(`/api/rest/users/${userId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(user => {
                    $('#deleteId').val(user.id);
                    $('#deleteUserId').text(user.id);
                    $('#deleteFirstName').val(user.firstName);
                    $('#deleteLastName').val(user.lastName);
                    $('#deleteAge').val(user.age);
                    $('#deleteEmail').val(user.email);

                    deleteRolesContainer.empty();
                    user.roles.forEach(role => {
                        deleteRolesContainer.append(`<div class="role-option"><label class="role-label ps-3">${role.name}</label></div>`);
                    });
                })
                .catch(error => {
                    console.error('Failed to fetch user details for delete:', error);
                });
        });

        deleteUserForm.on('submit', function (e) {
            e.preventDefault();
            const idToDelete = $('#deleteId').val();
            fetch(`/api/rest/users/${idToDelete}`, {
                method: 'DELETE',
                headers: {
                    [csrfHeader]: csrfToken
                }
            })
                .then(response => {
                    if (response.ok) {
                        deleteModal.modal('hide');
                        fetchUsers();
                    } else {
                        console.error('Failed to delete user');
                    }
                });
        });

        adminNewUserForm.on('submit', function (e) {
            e.preventDefault();
            const formData = $(this).serializeArray();
            const params = new URLSearchParams();

            formData.forEach(item => {
                params.append(item.name, item.value);
            });

            $('#adminRolesContainer input[name="roleIds"]:checked').each(function () {
                params.append('roleIds', $(this).val());
            });

            fetch('/api/rest/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    [csrfHeader]: csrfToken
                },
                body: params.toString()
            })
                .then(response => {
                    if (response.status === 201) {
                        $('#adminNewUser').removeClass('show active');
                        $('#adminUsers').addClass('show active');
                        $('#adminTabs button[data-bs-target="#adminUsers"]').tab('show');
                        adminNewUserForm[0].reset();
                        fetchUsers();
                    } else {
                        console.error('Failed to add user');
                        response.json().then(errorData => console.log(errorData));
                    }
                });
        });

        sidebar.on('click', '.nav-link', function (e) {
            e.preventDefault();
            const target = $(this).data('bs-target');
            const tab = new bootstrap.Tab(document.querySelector(`a[data-bs-target="${target}"]`));
            tab.show();

            if (target === '#userTabContent') {
                loadUserContent();
            } else if (target === '#adminUsersTabContent') {
                loadAdminContent();
            }
        });

        $('#adminNewUserTab').on('shown.bs.tab', function (e) {
            fetchRoles(adminRolesContainer);
        });
        logoutForm.on('submit', function (event) {
            event.preventDefault();

            fetch('/logout', {
                method: 'POST',
                headers: {
                    [csrfHeader]: csrfToken
                }
            })
                .then(response => {
                    if (response.ok) {
                        window.location.href = '/login';
                    } else {
                        console.error('Logout failed');
                    }
                })
                .catch(error => {
                    console.error('Error during logout:', error);
                });
        });
        fetchCurrentUser();
    });
</script>
</body>
</html>
