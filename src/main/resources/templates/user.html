<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #343a3f !important;
        }

        .logout-link {
            color: #9e9e9e !important;
            text-decoration: none !important;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-link:hover {
            color: #bdbdbd !important;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 500;
        }

        .sidebar {
            width: 200px;
            background: #fdfdfd;
            height: calc(100vh - 76px);
            position: fixed;
            padding-top: 20px;
        }

        .nav-link {
            color: #0d6efd !important;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .main-content {
            margin-left: 200px;
            padding: 20px;
            background-color: #f6f7f8;
        }

        .custom-table {
            margin: 1rem;
            border-collapse: collapse;
            width: calc(100% - 2rem);
            background-color: #fdfdfd;
        }

        .custom-table thead th {
            border-bottom: 2px solid #dee2e6 !important;
            background-color: #f8f9fa;
        }

        .custom-table th,
        .custom-table td {
            padding: 12px;
        }
    </style>
</head>
<meta name="_csrf" content=""/>
<meta name="_csrf_header" content=""/>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar py-3">
    <div class="container-fluid">
        <span class="navbar-brand text-white" id="userUserInfo"></span>
        <form method="post" action="/logout" class="d-inline" id="logoutForm">
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar">
    <nav class="nav flex-column" id="sidebarNav">
        <a class="nav-link active" href="#" data-page="user">User</a>
        <a class="nav-link admin-only" href="#" data-page="admin" style="display: none;">Admin</a>
    </nav>
</div>

<div id="userContent" class="main-content">
    <div class="container">
        <h1 class="mb-3">User information-page</h1>

        <div class="card border-0 bg-transparent">
            <div class="card-body">
                <table class="table custom-table table-striped" id="userInfoTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody id="userData"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        const userUserInfo = $('#userUserInfo');
        const userDataTableBody = $('#userData');
        const sidebarNav = $('#sidebarNav');
        const logoutForm = $('#logoutForm');
        const csrfToken = $('meta[name="_csrf"]').attr('content');
        const csrfHeader = $('meta[name="_csrf_header"]').attr('content');

        if (csrfToken && csrfHeader) {
            $('<input>').attr({
                type: 'hidden',
                name: csrfHeader,
                value: csrfToken
            }).appendTo(logoutForm);
        } else {
            console.error('CSRF token or header meta tags not found.');
        }

        function fetchCurrentUser() {
            fetch('/api/rest/current-user')
                .then(response => response.json())
                .then(user => {
                    const rolesText = user.roles.map(role => role.name).join(' ');
                    userUserInfo.text(`${user.firstName} with roles: ${rolesText}`);
                    displayUserInfo(user);

                    sidebarNav.empty();
                    sidebarNav.append('<a class="nav-link active" href="#" data-page="user">User</a>');
                    if (user.roles.some(role => role.name === 'ROLE_ADMIN')) {
                        sidebarNav.append('<a class="nav-link" href="#" data-page="admin">Admin</a>');
                    }

                    sidebarNav.on('click', '.nav-link', function (e) {
                        e.preventDefault();
                        const page = $(this).data('page');
                        if (page === 'admin') {
                            window.location.href = 'index.html';
                        }
                    });
                })
                .catch(error => {
                    console.error('Failed to fetch current user info:', error);
                    $('#userContent').html('<p class="text-danger">Failed to load user information.</p>');
                });
        }

        function displayUserInfo(user) {
            userDataTableBody.empty();
            const row = `
            <tr>
                <td>${user.id}</td>
                <td>${user.firstName}</td>
                <td>${user.lastName}</td>
                <td>${user.age}</td>
                <td>${user.email}</td>
                <td>${user.roles.map(role => role.name).join(', ')}</td>
            </tr>
        `;
            userDataTableBody.append(row);
        }

        fetchCurrentUser();
    });
</script>
</body>
</html>
