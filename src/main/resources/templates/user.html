<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Information</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-navbar {
            background-color: #343a3f !important;
        }

        .logout-link {
            color: #9e9e9e !important;
            text-decoration: none !important;
            transition: color 0.3s ease;
            font-size: 0.9rem;
        }

        .logout-link:hover {
            color: #bdbdbd !important;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 500;
        }

        .sidebar {
            width: 200px;
            background: #fdfdfd;
            height: calc(100vh - 76px);
            position: fixed;
            padding-top: 20px;
        }

        .nav-link {
            color: #0d6efd !important;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s;
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .main-content {
            margin-left: 200px;
            padding: 20px;
            background-color: #f6f7f8;
        }

        .custom-table {
            margin: 1rem;
            border-collapse: collapse;
            width: calc(100% - 2rem);
            background-color: #fdfdfd;
        }

        .custom-table thead th {
            border-bottom: 2px solid #dee2e6 !important;
            background-color: #f8f9fa;
        }

        .custom-table th,
        .custom-table td {
            padding: 12px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg custom-navbar py-3">
    <div class="container-fluid">
        <span class="navbar-brand text-white">
            <span th:text="${#authentication.name}"></span>
            with roles:
            <span th:each="role : ${#authentication.authorities}"
                  th:text="${role.authority} + ' '"></span>
        </span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-link logout-link p-0">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar">
    <nav class="nav flex-column">
        <a class="nav-link"
           href="/admin"
           th:if="${#lists.contains(#authentication.authorities.![authority], 'ROLE_ADMIN')}">Admin</a>
        <a class="nav-link active" href="/user">User</a>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <h1 class="mb-3">User information-page</h1>

        <div class="card border-0 bg-transparent">
            <div class="card-body">
                <table class="table custom-table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.age}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                                <span th:each="role : ${user.roles}"
                                      th:text="${role.name} + ' '"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
