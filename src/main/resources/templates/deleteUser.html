<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Admin Panel</span>
        <div class="navbar-text ms-auto">
            <span th:text="${#authentication.name} + ' with roles: ' + ${#authentication.authorities}"></span>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Delete user</h2>

    <div class="card col-md-6">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text" class="form-control" th:value="${user.id}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">First name</label>
                <input type="text" class="form-control" th:value="${user.name}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Last name</label>
                <input type="text" class="form-control" th:value="${user.lastname}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="text" class="form-control" th:value="${user.age}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" class="form-control" th:value="${user.username}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <input type="text" class="form-control"
                       th:value="${#strings.listJoin(user.roles.![name], ', ')}" readonly>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/admin" class="btn btn-secondary">Close</a>
                <form th:action="@{/admin/delete}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="id" th:value="${user.id}">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
